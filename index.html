<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Undian Member Aktif</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#080c18;color:#fff;font-family:Arial,sans-serif}
body{min-height:100vh}
.app{width:100%;max-width:1100px;margin:auto;background:#080c18}
.top{padding:14px 16px 12px;background:linear-gradient(105deg,#07162f,#11152c 48%,#4b090e)}
.title{font-size:clamp(19px,4vw,42px);font-weight:900;letter-spacing:1.5px;line-height:1.05;white-space:nowrap}
.subtitle{font-size:clamp(9px,1.5vw,16px);line-height:1.18;margin-top:6px;letter-spacing:.3px}
.stage{background:radial-gradient(circle at 50% 45%,#211637,#111629 52%,#080c18);padding:8px 8px 10px;display:flex;flex-direction:column;align-items:center}
.wheelbox{position:relative;width:min(62vw,330px);aspect-ratio:1/1;flex:none}
canvas{width:100%;height:100%;display:block}
.pointer{position:absolute;right:-12px;top:50%;transform:translateY(-50%);width:0;height:0;border-top:13px solid transparent;border-bottom:13px solid transparent;border-right:24px solid #fff;filter:drop-shadow(0 2px 2px #111)}
.winner{height:30px;padding-top:4px;color:#ffd447;font-size:clamp(13px,2vw,24px);font-weight:800;text-align:center}
.spin{background:#fff;color:#111;border:0;border-radius:9px;padding:8px 42px;font-size:clamp(19px,2.6vw,32px);font-weight:900;cursor:pointer}
.panel{margin:0 7px 9px;background:#171717;border:2px solid #333;border-radius:8px;overflow:hidden}
.tabs{display:flex;gap:26px;padding:0 12px;height:48px;align-items:end;border-bottom:1px solid #333}
.tab{font-size:clamp(14px,2.1vw,24px);font-weight:900;height:48px;display:flex;align-items:center;gap:9px;border-bottom:4px solid transparent;cursor:pointer}
.tab.active{border-bottom-color:#fff}
.badge{background:#777;border-radius:20px;padding:3px 11px;font-size:.65em}
.toolbar{display:flex;flex-wrap:wrap;gap:7px;padding:9px 14px}
.toolbar button,.editor button{background:#eee;color:#111;border:0;border-radius:7px;padding:8px 13px;font-size:clamp(11px,1.7vw,17px);font-weight:800}
.list{margin:0 10px 10px;height:260px;overflow:auto;background:#1d1d1d;border:2px solid #444;border-radius:8px;padding:9px 14px;font-size:clamp(12px,1.6vw,19px);line-height:1.3}
.result{display:block;color:#ffd447;font-weight:800}
.editor{display:none;margin:0 14px 14px}
.editor textarea{width:100%;height:260px;background:#202020;color:#fff;border:2px solid #555;border-radius:8px;padding:12px;font-size:16px;line-height:1.35;resize:vertical}
.editor button{margin-top:8px}
@media(max-width:600px){
  .top{padding:7px 9px 6px}
  .title{font-size:21px}
  .subtitle{font-size:9px;line-height:1.15;margin-top:5px}
  .stage{padding-top:7px;padding-bottom:9px}
  .wheelbox{width:min(62vw,300px)}
  .pointer{right:-11px;border-top-width:11px;border-bottom-width:11px;border-right-width:21px}
  .winner{height:28px;font-size:14px}
  .spin{padding:7px 38px;font-size:21px}
  .panel{margin:0 5px 8px}
  .tabs{height:44px;gap:18px;padding:0 10px}
  .tab{height:44px;font-size:15px}
  .toolbar{padding:8px 12px}
  .toolbar button{font-size:11px;padding:8px 10px}
  .list{height:240px;margin:0 9px 9px;font-size:12px}
}
</style>
</head>
<body>
<div class="app">
<div class="top">
<div class="title">UNDIAN MEMBER AKTIF 🎟️</div>
<div class="subtitle">HADIAH 50.000 UNTUK 15 ID YANG BERUNTUNG UNDIAN DI ADAKAN SETIAP HARI JUMAT DAN SELAMAT BAGI YANG BERUNTUNG SILAHKAN CEK ID 😊</div>
</div>
<div class="stage">
<div class="wheelbox"><canvas id="wheel" width="1000" height="1000"></canvas><div class="pointer"></div></div>
<div class="winner" id="winner"></div>
<button class="spin" id="spin">PUTAR</button>
</div>
<div class="panel">
<div class="tabs">
<div class="tab" id="entriesTab">Entries <span class="badge" id="entriesCount">0</span></div>
<div class="tab active" id="resultsTab">Results <span class="badge" id="resultsCount">0</span></div>
</div>
<div class="toolbar">
<button id="sort">↕ Sort</button>
<button id="clear">✕ Clear the list</button>
<button id="export">▣ Export results</button>
</div>
<div class="list" id="list"></div>
<div class="editor" id="entryEditor">
<textarea id="entryInput"></textarea>
<button id="saveEntries">💾 Simpan Entries</button>
</div>
<div class="editor" id="winnerEditor">
<textarea id="winnerInput"></textarea>
<button id="saveWinners">💾 Simpan Pemenang</button>
</div>
</div>
</div>

<script>
const initialParticipants=[

"afib0","sitisar","vani","agussulis","dclarasati","silit","nochino","cycin","atala","gocihk",

"rayy18","peter27","roki","rocky45","jowo21","pesona12"

let fixedWinners=[
"aliudin02","ariel1806","dollar432d","epanau","hafiz1",
"idutt","komsky001","lawanbandot","munawali","onetogel",
"ozil25","serapim","soft","sugiharto79","yatul"
];

let participants=initialParticipants.slice();
let results=[];
let winnerIndex=0,busy=false,angle=0,mode='results';

try{
const p=JSON.parse(localStorage.getItem('wheelParticipants_v3')||'null');
const w=JSON.parse(localStorage.getItem('wheelWinners_v3')||'null');
if(Array.isArray(p))participants=p;
if(Array.isArray(w)&&w.length)fixedWinners=w;
}catch(e){}

const canvas=document.getElementById('wheel');
const ctx=canvas.getContext('2d');
const list=document.getElementById('list');
const entryInput=document.getElementById('entryInput');
const winnerInput=document.getElementById('winnerInput');

function drawWheel(){
const n=Math.max(participants.length,1);
const cx=500,cy=500,r=475,arc=Math.PI*2/n;
ctx.clearRect(0,0,1000,1000);

for(let i=0;i<n;i++){
const s=angle+i*arc;

ctx.beginPath();
ctx.moveTo(cx,cy);
ctx.arc(cx,cy,r,s,s+arc);
ctx.closePath();
ctx.fillStyle=`hsl(${i*360/n},82%,54%)`;
ctx.fill();

ctx.strokeStyle='rgba(255,255,255,.22)';
ctx.stroke();

ctx.save();
ctx.translate(cx,cy);
ctx.rotate(s+arc/2);
ctx.textAlign='right';
ctx.fillStyle='#111';

const fs=n>250?4:n>180?4.5:n>120?5:n>80?6:Math.max(5,Math.min(15,Math.floor(480/n*1.4)));

ctx.font=`700 ${fs}px Arial`;
ctx.fillText(participants[i],r-7,1);
ctx.restore();
}

ctx.beginPath();
ctx.arc(cx,cy,43,0,Math.PI*2);
ctx.fillStyle='#fff';
ctx.fill();
}

function render(){
document.getElementById('entriesCount').textContent=participants.length;
document.getElementById('resultsCount').textContent=results.length;

document.getElementById('entriesTab').classList.toggle('active',mode==='entries');
document.getElementById('resultsTab').classList.toggle('active',mode!=='entries');

list.style.display=mode==='results'?'block':'none';

document.getElementById('entryEditor').style.display=mode==='entries'?'block':'none';
document.getElementById('winnerEditor').style.display=mode==='winner'?'block':'none';

if(mode==='results'){
list.innerHTML=results.length
?results.map((x,i)=>`<span class="result">${i+1}. ${x}</span>`).join('')
:'<span style="color:#aaa">Belum ada hasil.</span>';
}

if(mode==='entries'){
entryInput.value=participants.join('\n');
}

if(mode==='winner'){
winnerInput.value=fixedWinners.join('\n');
}
}

function spin(){
if(busy||winnerIndex>=fixedWinners.length)return;

busy=true;

const start=angle;
const end=start+Math.PI*2*(7+Math.random()*2);
const t0=performance.now();
const dur=2800;

function f(t){
const p=Math.min(1,(t-t0)/dur);
const e=1-Math.pow(1-p,3);

angle=start+(end-start)*e;
drawWheel();

if(p<1){
requestAnimationFrame(f);
}else{
busy=false;

const w=fixedWinners[winnerIndex++];
results.push(w);

document.getElementById('winner').textContent='🏆 '+w;

mode='results';
render();
}
}

requestAnimationFrame(f);
}

document.getElementById('spin').onclick=spin;

document.getElementById('entriesTab').onclick=()=>{
mode='entries';
render();
};

document.getElementById('resultsTab').onclick=()=>{
mode='results';
render();
};

document.getElementById('saveEntries').onclick=()=>{
participants=entryInput.value
.split(/\r?\n/)
.map(x=>x.trim())
.filter(Boolean);

localStorage.setItem(
'wheelParticipants_v3',
JSON.stringify(participants)
);

results=[];
winnerIndex=0;

document.getElementById('winner').textContent='';

drawWheel();

mode='entries';
render();

alert('Entries berhasil disimpan: '+participants.length+' nama.');
};

document.getElementById('saveWinners').onclick=()=>{
fixedWinners=winnerInput.value
.split(/\r?\n/)
.map(x=>x.trim())
.filter(Boolean);

localStorage.setItem(
'wheelWinners_v3',
JSON.stringify(fixedWinners)
);

results=[];
winnerIndex=0;

document.getElementById('winner').textContent='';

mode='results';
render();

alert('Pemenang berhasil disimpan: '+fixedWinners.length+' nama.');
};

document.getElementById('sort').onclick=()=>{
participants.sort((a,b)=>a.localeCompare(b));

localStorage.setItem(
'wheelParticipants_v3',
JSON.stringify(participants)
);

drawWheel();
render();
};

document.getElementById('clear').onclick=()=>{
if(confirm('Hapus daftar peserta?')){
participants=[];
results=[];
winnerIndex=0;

localStorage.setItem(
'wheelParticipants_v3',
'[]'
);

drawWheel();
render();
}
};

document.getElementById('export').onclick=()=>{
const a=document.createElement('a');

a.href=URL.createObjectURL(
new Blob([results.join('\n')],{type:'text/plain'})
);

a.download='hasil-undian.txt';
a.click();
};

drawWheel();
render();
</script>
</body>
</html>
